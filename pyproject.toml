[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-engineer-doctor"
version = "0.1.4"
description = "Open-source, evidence-driven diagnosis for modern data engineering failures"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aditya Singh Rathore", email = "rathoreadityasingh40@gmail.com" }]
keywords = ["data-engineering", "spark", "pyspark", "databricks", "diagnostics", "troubleshooting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/Adez017/Data-Engineer-Doctor"
Documentation = "https://Adez017.github.io/Data-Engineer-Doctor/"
Repository = "https://github.com/Adez017/Data-Engineer-Doctor"
Issues = "https://github.com/Adez017/Data-Engineer-Doctor/issues"
Changelog = "https://github.com/Adez017/Data-Engineer-Doctor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "build>=1.2",
    "twine>=5",
    "pip-audit>=2.7",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[project.scripts]
dedoc = "dedoc.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "build>=1.2",
    "twine>=5",
    "pip-audit>=2.7",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["dedoc"]

[tool.hatch.build.targets.wheel.force-include]
"diagnoses" = "dedoc/diagnoses"

[tool.hatch.build.targets.sdist]
include = [
    "dedoc",
    "diagnoses",
    "fixtures",
    "benchmarks",
    "examples",
    "tests",
    "docs",
    "BUILD_PLAN.md",
    "README.md",
    "CONTRIBUTING.md",
    "RELEASING.md",
    "SECURITY.md",
    "LICENSE",
    "Makefile",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["dedoc"]
strict = true
warn_unreachable = true
