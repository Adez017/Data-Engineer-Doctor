site_name: Data Engineer Doctor (DEDoc)
site_description: Open-source, evidence-driven diagnosis for modern data engineering failures
site_author: Aditya Singh Rathore
site_url: https://Adez017.github.io/Data-Engineer-Doctor/
repo_url: https://github.com/Adez017/Data-Engineer-Doctor
repo_name: Adez017/Data-Engineer-Doctor
edit_uri: blob/main/docs/
copyright: © 2026 Aditya Singh Rathore — Data Engineer Doctor

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.action.edit
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Adez017/Data-Engineer-Doctor
    - icon: fontawesome/solid/envelope
      link: mailto:rathoreadityasingh40@gmail.com

extra_css:
  - assets/theme/extra.css

nav:
  - Home: index.md
  - Getting started:
      - First diagnosis: tutorial/first-diagnosis.md
  - How-to guides:
      - Installation: how-to/installation.md
      - Configuration: how-to/configuration.md
      - Use in GitHub Actions: how-to/github-action.md
      - Recipes: how-to/recipes.md
      - Troubleshooting: how-to/troubleshooting.md
      - FAQ: how-to/faq.md
      - When to use DEDoc: how-to/when-to-use.md
  - Reference:
      - CLI reference: reference/cli.md
      - Python SDK reference: reference/sdk.md
      - Diagnosis catalog: reference/diagnosis-catalog.md
      - Full diagnosis reference: reference/diagnosis-reference.md
      - Evaluation & benchmarks: reference/evaluation.md
      - Top 25 user queries map: reference/top-25-queries.md
  - Explanation:
      - Architecture overview: explanation/architecture.md
      - Confidence model: explanation/confidence-model.md
      - Security & privacy: explanation/security-model.md
      - Versioning & compatibility: explanation/versioning-compatibility.md
  - Operations:
      - Production adoption checklist: operations/production-adoption-checklist.md
      - Docs review rubric: operations/docs-review-rubric.md
      - Release docs audit checklist: operations/release-docs-audit.md
      - Docs success metrics: operations/docs-success-metrics.md
  - Contributing: contributing.md

strict: true
