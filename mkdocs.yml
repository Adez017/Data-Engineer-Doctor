site_name: Data Engineer Doctor (DEDoc)
site_description: Open-source, evidence-driven diagnosis for modern data engineering failures
site_author: Aditya Singh Rathore
site_url: https://Adez017.github.io/Data-Engineer-Doctor/
copyright: © 2026 Aditya Singh Rathore — Data Engineer Doctor

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: deep-orange
      accent: deep-orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-orange
      accent: deep-orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Adez017/Data-Engineer-Doctor
    - icon: fontawesome/solid/envelope
      link: mailto:rathoreadityasingh40@gmail.com

extra_css:
  - assets/theme/extra.css

nav:
  - Home: index.md
  - Usage: usage.md
  - Diagnosis reference: diagnosis-reference.md
  - Python SDK: sdk.md
  - Contributing: contributing.md
  - Security: security.md

strict: true