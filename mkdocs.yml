site_name: Data Engineer Doctor (DEDoc)
site_description: Open-source, evidence-driven diagnosis for modern data engineering failures
site_author: Aditya Singh Rathore
site_url: https://Adez017.github.io/Data-Engineer-Doctor/
repo_url: https://github.com/Adez017/Data-Engineer-Doctor
repo_name: Adez017/Data-Engineer-Doctor
edit_uri: blob/main/docs/
copyright: © 2026 Aditya Singh Rathore — Data Engineer Doctor

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.footer
    - toc.follow
    - content.action.edit
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Adez017/Data-Engineer-Doctor
    - icon: fontawesome/solid/envelope
      link: mailto:rathoreadityasingh40@gmail.com

extra_css:
  - assets/theme/extra.css

nav:
  - Home: index.md
  - Usage: usage.md
  - Diagnosis reference: diagnosis-reference.md
  - Python SDK: sdk.md
  - Contributing: contributing.md
  - Security: security.md

strict: true