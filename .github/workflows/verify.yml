name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup environment
        run: make setup
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Verify (authoritative pipeline)
        run: make verify

  action:
    name: github action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from source
        run: python -m pip install .

      - name: Diagnose a known failure (no gate)
        uses: ./
        with:
          path: fixtures/positive/spark-executor-oom/input.log
          format: markdown
          install: "false"

      - name: Diagnose with a gate (must fail the step)
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: fixtures/positive/spark-executor-oom/input.log
          fail-on: diagnosed
          install: "false"

      - name: Abstention does not trip the gate
        uses: ./
        with:
          path: fixtures/negative/unrelated-python-error/input.log
          fail-on: diagnosed
          install: "false"

      - name: Assert the gate failed as expected
        run: test "${{ steps.gate.outcome }}" = "failure"
